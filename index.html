 PILL: Greet 3 cobblers"}, {"clip": "MC007", "task": "Greet 3 cobblers", "kind": "reward", "dur": 9.43, "caps": ["Tuck waves his needle.", "Bramble curtsies.", "Fennimore nods, very slowly,", "which from Fennimore is a warm welcome indeed."], "at": [0, 1.78, 3.34, 6.23], "after": "then MUSIC 12-15 s"}, {"clip": "MC008", "task": "Color the slipper shelves", "kind": "setup", "dur": 19.46, "caps": ["Now, about that peculiar job.", "In the castle above us live twelve princesses", "who are very good at keeping a secret.", "Every night, when the castle is asleep, they slip away", "and dance until the sky turns pale.", "And every morning, their slippers come back worn clean through."], "at": [0, 0.69, 2.91, 8.78, 11.22, 15.42], "after": "2.0 s"}, {"clip": "MC009", "task": "Color the slipper shelves", "kind": "setup", "dur": 14.76, "caps": ["So every night, the slippers find their way here,", "to twelve wooden cubbies along the back wall,", "each pair as big as a garden shed.", "To a princess, they're dainty.", "To a cobbler, they're a day's walk from heel to toe."], "at": [0, 3.32, 6.14, 8.89, 11.15], "after": "TASK PILL: Color the slipper shelves"}, {"clip": "MC010", "task": "Color the slipper shelves", "kind": "reward", "dur": 7.55, "caps": ["Twelve pairs, waiting patiently.", "And in three hundred years,", "the guild has never once been late."], "at": [0, 2.57, 4.74], "after": "then MUSIC 12-15 s"}, {"clip": "MC011", "task": "Color the rolling ladder", "kind": "setup", "dur": 12.2, "caps": ["To reach the top cubbies, the guild uses a rolling ladder", "that squeaks on the third rung.", "Nobody has ever oiled it.", "Fennimore says the squeak is how the ladder knows", "it's being useful."], "at": [0, 3.86, 5.96, 7.66, 10.98], "after": "TASK PILL: Color the rolling ladder"}, {"clip": "MC012", "task": "Color the rolling ladder", "kind": "reward", "dur": 2.4, "caps": ["Squeak.", "Just as it should."], "at": [0, 1.01], "after": "then MUSIC 12-15 s"}, {"clip": "MC013", "task": r": "TASK PILL: Wake the shop cat, gently"}, {"clip": "MC034", "task": "Wake the shop cat, gently", "kind": "reward", "dur": 6.03, "caps": ["One eye opens.", "One slow blink.", "And back to sleep she goes."], "at": [0, 1.91, 3.84], "after": "then MUSIC 18-25 s"}, {"clip": "MC035", "task": "", "kind": "closing", "dur": 9.93, "caps": ["The lantern is burning low.", "The thread is put away.", "Twelve pairs of slippers sit in their cubbies, mended,", "and softly glowing."], "at": [0, 2.45, 4.62, 8.27], "after": "2.5 s"}, {"clip": "MC036", "task": "", "kind": "closing", "dur": 10.53, "caps": ["In a little while,", "they'll find their way back to the castle,", "and twelve princesses will wake and never quite know why", "their slippers feel so comfortable."], "at": [0, 1.37, 3.75, 5.97], "after": "2.5 s"}, {"clip": "MC037", "task": "", "kind": "closing", "dur": 4.78, "caps": ["You did very well tonight, apprentice.", "The guild is proud of you."], "at": [0, 2.7], "after": "2.5 s"}, {"clip": "MC038", "task": "", "kind": "closing", "dur": 2.17, "caps": ["Now rest.", "Goodnight."], "at": [0, 1.26], "after": "fade music out over 60 s"}];

  const g = ac.createGain(); g.gain.value = 0; src.connect(g).connect(musicBus);
  const t = ac.currentTime; src.start(t);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + fade);
  if (cueGain) { const og = cueGain, os = cueSrc; og.gain.setValueAtTime(og.gain.value, t); og.gain.linearRampToValueAtTime(0, t + fade); os.stop(t + fade + 0.1); }
  cueSrc = src; cueGain = g;
}
async function playEnding() {
  const buf = await buffer(ENDING), t = ac.currentTime;
  const src = ac.createBufferSource(); src.buffer = buf; const g = ac.createGain(); g.gain.value = 0;
  src.connect(g).connect(musicBus); src.start(t); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + 6);
  if (cueGain) { cueGain.gain.setValueAtTime(cueGain.gain.value, t); cueGain.gain.linearRampToValueAtTime(0, t + 6); cueSrc.stop(t + 6.2); cueGain = null; }
}
function cueForClip(clip) { let c = 0; CUES.forEach((q, i) => { if (clip >= q.from) c = i; }); return c; }

/* ---------- narration ---------- */
const capEl = document.getElementById("caption");
const cueEl = document.getElementById("cue"), cueFill = document.getElementById("cueFill"), cueText = document.getElementById("cueText");
let clipIdx = -1, voiceSrc = null, runToken = 0, activeTask = null, nudgeT0 = 0;
function showCaption(text) {
  capEl.classList.add("fade");
  setTimeout(() => { capEl.textContent = text; capEl.classList.remove("fade"); }, 380);
}
const wait = (s, tok) => new Promise((r) => setTimeout(() => r(tok === runToken), (FAST ? s / 20 : s) * 1000));
// David found the script's long music breaks (12-25 s) too slow, so each break is a short breath now.
function afterSeconds(after) {
  const m = after.match(/([\d.]+)\s*-\s*([\d.]+)\s*s/); if (m) return (+m[1] + +m[2]) / 2 * 0.22;
  const n = after.match(/([\d.]+)\s*s/); return n ? Math.min(+n[1], 1.2) : 1.2;
}
async function playClip(i, tok) {
  const C = CLIPS[i]; const url = `audio/${C.clip}.mp3`;
  let buf = null; try { buf = await buffer(url); } catch (e) { console.warn("Couldn't load", url, e); delete buffers[url]; }
  if (tok !== runToken) return false;
  buffer(`audio/${CLIPS[i + 1]?.clip}.mp3`).catch(() => {}); // fetch the next line early
  const t = ac.currentTime + 0.05;
  musicBus.gain.setTargetAtTime(muted ? 0 : MUSIC_LEVEL * DUCK, ac.currentTime, 0.4);
  const rate = FAST ? 8 : 1;
  if (buf) { const src = ac.createBufferSource(); src.buffer = buf; src.connect(voiceBus); voiceSrc = src; src.playbackRate.value = rate; src.start(t); }
  C.caps.forEach((cap, k) => setTimeout(() => { if (tok === runToken) showCaption(cap); }, (C.at[k] / rate) * 1000));
  // Move on when the line has had time to finish, even if the phone never reports that it ended.
  await new Promise((r) => setTimeout(r, ((buf ? buf.duration : C.dur || 4) / rate + 0.15) * 1000));
  musicBus.gain.setTargetAtTime(muted ? 0 : MUSIC_LEVEL, ac.currentTime, 1.2);
  setTimeout(() => { if (tok === runToken) capEl.classList.add("fade"); }, FAST ? 100 : 1600);
  return tok === runToken;
}
async function run(tok) {
  for (clipIdx = 0; clipIdx < CLIPS.length; clipIdx++) {
    const C = CLIPS[clipIdx];
    const want = cueForClip(C.clip); if (want !== cueNow) playCue(want);
    // Outline the task's pieces while its setup line plays, so "the teal pair" points at a slipper that is still white clay.
    if (C.kind === "setup" && TASKS[C.task]) outline.selectedObjects = TASKS[C.task].list.filter((P) => !P.done).flatMap((P) => P.meshes);
    if (!(await playClip(clipIdx, tok))) return;
    if (C.after.startsWith("TASK PILL")) {
      if (!(await doTask(C.task, tok))) return;
      if (!(await wait(0.8, tok))) return;
    } else if (C.after.startsWith("fade")) {
      playEnding(); finishStory(); return;
    } else if (!(await wait(afterSeconds(C.after), tok))) return;
  }
}

/* ---------- tasks ---------- */
let taskResolve = null;
function doTask(name, tok) {
  const T = TASKS[name];
  if (!T) { console.warn("No pieces for", name); return Promise.resolve(true); }
  activeTask = T; T.name = name;
  cueText.textContent = name; cueFill.style.width = "0%"; cueEl.classList.remove("off", "full");
  outline.selectedObjects = T.list.filter((P) => !P.done).flatMap((P) => P.meshes);
  nudgeT0 = performance.now();
  return new Promise((r) => { taskResolve = () => r(tok === runToken); });
}
function taskProgress(T) { return T.list.reduce((s, P) => s + (P.done ? 1 : Math.min(1, P.progress / DONE_AT)), 0) / T.list.length; }
function updatePill() {
  const T = activeTask; if (!T) return;
  const p = taskProgress(T);
  cueFill.style.width = Math.round(p * 100) + "%";
  outline.selectedObjects = T.list.filter((P) => !P.done).flatMap((P) => P.meshes);
}
function completeTask() {
  const T = activeTask; activeTask = null; outline.selectedObjects = [];
  cueFill.style.width = "100%"; cueEl.classList.add("full"); taskSound();
  setTimeout(() => cueEl.classList.add("off"), 900);
  updateProgress();
  if (T.cat) { purr(); anim.cat.wakeT0 = performance.now(); }
  if (taskResolve) { const r = taskResolve; taskResolve = null; setTimeout(r, 600); }
}
function updateProgress() {
  const done = Object.values(TASKS).filter((T) => T.list.every((P) => P.done)).length;
  const pct = Math.round(done / Object.keys(TASKS).length * 100);
  document.getElementById("plabel").textContent = `Progress ${pct}%`;
  document.getElementById("pbar").style.width = pct + "%";
}

/* ---------- tapping ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
canvas.addEventListener("pointerdown", (e) => { downAt = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener("pointerup", (e) => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y); downAt = null;
  if (moved > 8) return; // that was a drag to look around
  tapAt(e.clientX, e.clientY);
});
function ringAt(x, y) {
  const d = document.createElement("div"); d.className = "ring"; d.style.left = x + "px"; d.style.top = y + "px";
  document.body.appendChild(d); setTimeout(() => d.remove(), 800);
}
function hitAt(cx, cy) {
  ndc.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(world.children, true).filter((h) => h.object.visible);
  const h = hits[0]; if (!h) return null;
  return { P: pieces[h.object.userData.piece] || null, point: h.point };
}
let tapCount = 0;
function tapAt(cx, cy) {
  ringAt(cx, cy);
  const T = activeTask; if (!T) return;
  const hit = hitAt(cx, cy);
  if (!hit || !hit.P || hit.P.task !== T.name || hit.P.done) {
    // Small things (a leaf, a spool) count if the tap lands close to them, so fingers don't have to be exact.
    const near = T.list.filter((P) => P.small && !P.done).map((P) => {
      const p = P.center.clone().project(camera);
      return { P, d: Math.hypot((p.x + 1) / 2 * innerWidth - cx, (1 - p.y) / 2 * innerHeight - cy), behind: p.z > 1 };
    }).filter((q) => !q.behind && q.d < 34).sort((a, b) => a.d - b.d)[0];
    if (near) { paintAt(near.P, near.P.center); return; }
    // A miss makes the gold outline flare, so the listener can find the right thing.
    nudgeT0 = performance.now(); return;
  }
  paintAt(hit.P, hit.point);
}
function paintAt(P, point) {
  const now = performance.now() / 1000;
  P.splats[P.count % MAX_SPLATS].set(point.x, point.y, point.z, now); P.count++;
  tapSound(tapCount++);
  if (P.small) { finishPiece(P); return; }
  const r2 = Math.pow(P.R.value * 1.05, 2); let c = 0;
  P.samples.forEach((s, k) => { if (!P.covered[k] && s.distanceToSquared(point) < r2) P.covered[k] = 1; c += P.covered[k]; });
  P.progress = c / P.samples.length;
  if (P.progress >= DONE_AT || P.count >= MAX_SPLATS) finishPiece(P);
  else updatePill();
}
function finishPiece(P) {
  P.done = true; P.fullT0 = performance.now();
  const T = TASKS[P.task];
  if (T.greet) greet(P);
  const left = T.list.filter((q) => !q.done).length;
  if (left) doneSound(T.list.length - left);
  updatePill();
  if (!left) completeTask();
}
function greet(P) {
  const a = anim[["tuck", "bramble", "fennimore"].find((id) => named[id].includes(P.meshes[0]))];
  if (a) a.greetT0 = performance.now();
}

/* ---------- every frame ---------- */
const moon = (() => {
  // A small night sky with a crescent moon behind the round window.
  const cv = document.createElement("canvas"); cv.width = cv.height = 256; const x = cv.getContext("2d");
  const g = x.createRadialGradient(150, 100, 10, 128, 128, 180); g.addColorStop(0, "#2a3a6e"); g.addColorStop(1, "#0b1030");
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 40; i++) { x.fillStyle = `rgba(255,255,230,${0.3 + Math.random() * 0.6})`; x.fillRect(Math.random() * 256, Math.random() * 256, 1.6, 1.6); }
  x.fillStyle = "#fff3c4"; x.beginPath(); x.arc(170, 90, 34, 0, Math.PI * 2); x.fill();
  x.globalCompositeOperation = "destination-out"; x.beginPath(); x.arc(186, 80, 30, 0, Math.PI * 2); x.fill();
  x.globalCompositeOperation = "destination-over"; x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.CircleGeometry(0.15, 40), new THREE.MeshBasicMaterial({ map: t, color: 0x444444 }));
  m.position.set(-0.105, 0.585, -0.37); world.add(m); named.moonSky = [m]; return m;
})();
let frameErrs = 0;
function frame(now) {
  try { frameBody(now); } catch (e) { if (frameErrs++ < 3) __diag("Frame: " + e.message); try { composer.render(); } catch (e2) { if (frameErrs < 5) __diag("Render: " + e2.message); } }
  requestAnimationFrame(frame);
}
function frameBody(now) {
  controls.update();
  paintTime.value = now / 1000;
  for (const P of pieces) if (P.done) P.full.value = Math.min(1, (now - P.fullT0) / 800);
  // a wrong tap makes the outline flare
  outline.edgeStrength = 3.4 + Math.max(0, 1 - (now - nudgeT0) / 800) * 6;
  // lantern: warm light grows once lit, with a gentle flicker
  const lit = TASKS["Light the shop lantern"].list;
  const lk = lit.filter((P) => P.done).length / lit.length;
  const fl = 1 + Math.sin(now / 90) * 0.06 + Math.sin(now / 233) * 0.05;
  lanternLight.intensity += ((lk * 0.9 * fl) - lanternLight.intensity) * 0.05;
  lit.forEach((P) => P.meshes.forEach((m) => { if (m.material.emissive) m.material.emissive.setRGB(1, 0.55, 0.18).multiplyScalar(P.done ? 0.22 * fl * Math.min(1, P.full.value) : 0); }));
  const win = TASKS["Color the moon window"].list[0];
  moon.material.color.setScalar(0.27 + 0.73 * (win.done ? win.full.value : 0));
  // the characters' small idle motions
  if (!reduceMotion) {
    const t = now / 1000;
    if (anim.fennimore) anim.fennimore.inner.rotation.x = Math.sin(t * 0.5) * 0.06 + 0.03;
    if (anim.cat) anim.cat.inner.scale.y = 1 + Math.sin(t * 1.4) * 0.025;
    if (anim.bramble) anim.bramble.inner.rotation.z = Math.sin(t * 0.7) * 0.03;
    if (anim.tuck) anim.tuck.inner.rotation.x = Math.sin(t * 1.1) * 0.03;
  }
  for (const id of ["tuck", "bramble", "fennimore"]) {
    const a = anim[id]; if (!a || !a.greetT0) continue;
    const k = (now - a.greetT0) / 900; if (k > 1) { a.greetT0 = 0; a.inner.position.y = 0; continue; }
    const s = Math.sin(k * Math.PI);
    if (id === "tuck") a.inner.position.y = s * 0.02;                 // a little hop and wave
    if (id === "bramble") a.inner.position.y = -s * 0.008, a.inner.rotation.x = s * 0.18; // a curtsy
    if (id === "fennimore") a.inner.rotation.x = s * 0.35;             // a slow, deep nod
  }
  if (anim.cat?.wakeT0) {
    const k = (now - anim.cat.wakeT0) / 2600;
    if (k < 1) { const s = Math.sin(k * Math.PI); anim.cat.inner.scale.y = 1 + s * 0.08; anim.cat.inner.rotation.z = s * 0.04; }
  }
  composer.render();
}

/* ---------- start, finish, buttons ---------- */
const beginBtn = document.getElementById("begin");
loadAll((p) => { beginBtn.textContent = `Loading the workshop… ${Math.round(p * 100)}%`; }).then(() => {
  buildPieces();
  if (DEBUG === "regions") debugRegions();
  if (DEBUG && DEBUG.startsWith("part")) debugParts(DEBUG.slice(4).split("-").map(Number));
  beginBtn.disabled = false; beginBtn.textContent = "Begin";
  requestAnimationFrame(frame);
}).catch((e) => { console.error(e); beginBtn.textContent = "The workshop didn't load. Reload the page to try again."; });

function begin() {
  initAudio(); if (ac.state === "suspended") ac.resume();
  document.getElementById("intro").hidden = true; document.getElementById("end").hidden = true;
  const tok = ++runToken;
  pieces.forEach((P) => { P.done = false; P.progress = 0; P.count = 0; P.covered.fill(0); P.full.value = 0; P.splats.forEach((s) => s.set(0, -99, 0, -1e6)); });
  updateProgress(); cueNow = -1;
  run(tok);
}
function finishStory() {
  cueEl.classList.add("off");
  setTimeout(() => { document.getElementById("end").hidden = false; }, FAST ? 200 : 20000);
}
beginBtn.addEventListener("click", begin);
document.getElementById("again").addEventListener("click", begin);
document.getElementById("mute").addEventListener("click", (e) => {
  muted = !muted;
  if (master) master.gain.setTargetAtTime(muted ? 0 : 1, ac.currentTime, 0.3);
  document.getElementById("snd-on").hidden = muted; document.getElementById("snd-off").hidden = !muted;
  e.currentTarget.setAttribute("aria-label", muted ? "Turn sound on" : "Mute sound");
});

function debugRegions() {
  // Paints every task's pieces in its own flat color, to check what belongs to what.
  const hues = Object.keys(TASKS);
  pieces.forEach((P) => { const h = hues.indexOf(P.task) / hues.length; P.meshes.forEach((m) => { m.material = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(h, 0.85, 0.55) }); }); });
  world.traverse((m) => { if (m.isMesh && m.userData.piece === -1) m.material = new THREE.MeshStandardMaterial({ color: 0x333333 }); });
  scene.background = new THREE.Color(0x111111);
}

function debugParts(list) {
  world.traverse((m) => { if (m.isMesh) m.material = new THREE.MeshStandardMaterial({ color: 0x555555, transparent: true, opacity: 0.4 }); });
  list.forEach((k, j) => { if (partMesh[k]) partMesh[k].material = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(j / list.length, 0.9, 0.55), emissive: new THREE.Color().setHSL(j / list.length, 0.9, 0.2) }); });
  scene.background = new THREE.Color(0x111111);
}
// Test hooks for automated walk-throughs.
if (DEBUG) Object.assign(window, { __parts: partMesh, __THREE: THREE, __named: named }); // for the test scripts
window.__mc = {
  get clip() { return CLIPS[clipIdx]?.clip; }, get task() { return activeTask?.name || null; },
  get pill() { return activeTask ? taskProgress(activeTask) : null; },
  pieces: () => pieces.map((P) => ({ id: P.id, task: P.task, done: P.done, small: P.small })),
  pointFor(id) {
    const P = pieces[id];
    const order = P.samples.map((s, k) => k).filter((k) => !P.covered[k]).sort(() => Math.random() - 0.5);
    for (const k of order.slice(0, 300)) {
      const s = P.samples[k].clone().project(camera);
      const x = (s.x + 1) / 2 * innerWidth, y = (1 - s.y) / 2 * innerHeight;
      if (s.z > 1 || x < 2 || y < 2 || x > innerWidth - 2 || y > innerHeight - 2) continue;
      const h = hitAt(x, y); if (h && h.P === P) return { x, y };
    }
    return null;
  },
  look(t, p) { controls.target.set(...t); camera.position.set(...p); controls.update(); },
  turn(az, polar) { const off = camera.position.clone().sub(controls.target), sph = new THREE.Spherical().setFromVector3(off); sph.theta += az; if (polar) sph.phi = polar; camera.position.copy(controls.target).add(v3(0,0,0).setFromSpherical(sph)); controls.update(); },
  home: homeCamera,
};
</script>
